services:
  frontend:
    build: frontend/.
    # image: ghcr.io/realsigmainyou/bibliotek-fagpr-ve-jakob-frontend

    ports:
      - "127.0.0.1:8080:80"
  
  backend:
    build: .
    # image: ghcr.io/realsigmainyou/bibliotek-fagpr-ve-jakob
    ports:
     - "127.0.0.1:5000:80"
    environment:
      - postgres_host=database
      - postgres_port=5432
      - postgres_pw=changeme
      - db_name=library_fagprove
      - dev-secret=changeme
      - JWT_SECRET=changeme

  database:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=library_fagprove
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - "./db:/var/lib/postgresql"